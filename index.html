<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Video</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #eee;
               font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }

  #bar { display: none; flex: 0 0 auto; gap: 6px; padding: 6px;
         background: #262626; border-bottom: 1px solid #3a3a3a; align-items: center; }
  #bar span { flex: 1; font-size: 12px; opacity: .6; overflow: hidden;
              white-space: nowrap; text-overflow: ellipsis; }
  #bar button { padding: 4px 8px; font-size: 12px; }
  #bar button.off { background: #6b2b2b; border-color: #6b2b2b; }

  #call { flex: 1 1 auto; width: 100%; border: 0; display: none; }

  /* Peer-to-peer video grid */
  #grid { display: none; flex: 1 1 auto; overflow-y: auto; padding: 6px;
          gap: 6px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
          align-content: start; }
  .tile { position: relative; background: #000; border-radius: 8px; overflow: hidden;
          aspect-ratio: 4 / 3; }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile b { position: absolute; left: 0; bottom: 0; right: 0; padding: 2px 6px;
            font: 500 11px system-ui; background: linear-gradient(transparent, #000c);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.waiting::after { content: "connecting…"; position: absolute; inset: 0;
            display: grid; place-items: center; font-size: 11px; opacity: .5; }

  #setup { flex: 1 1 auto; padding: 16px; display: none; flex-direction: column; gap: 10px;
           overflow-y: auto; }
  label { font-size: 12px; opacity: .65; }
  input, button, select { padding: 8px 10px; font: inherit; border-radius: 6px;
                          border: 1px solid #4a4a4a; background: #2c2c2c; color: #eee; }
  input { width: 100%; box-sizing: border-box; }
  button { cursor: pointer; }
  button:hover { background: #383838; }
  #join { background: #bb99ff; color: #1e1e1e; border-color: #bb99ff; font-weight: 600; }
  #join:hover { background: #cdb3ff; }
  #join:disabled { background: #444; color: #999; border-color: #444; cursor: default; }
  p { margin: 0; font-size: 12px; opacity: .6; }
  .err { color: #ff9b9b; }
  #hostRow, #fallback, #gmRow { display: none; }
  hr { border: 0; border-top: 1px solid #3a3a3a; margin: 4px 0; }
  .row { display: flex; gap: 6px; }
  .row button { flex: 0 0 auto; }

  #boot { flex: 1 1 auto; padding: 16px; font-size: 13px; }
  #boot code { display: block; margin-top: 8px; padding: 8px; background: #000;
               border-radius: 6px; font-size: 11px; white-space: pre-wrap;
               word-break: break-all; color: #ff9b9b; }
</style>
</head>
<body>

<div id="boot">Connecting to Owlbear&hellip;</div>

<div id="bar">
  <span id="barLabel"></span>
  <button id="mic" title="Mute microphone">Mic</button>
  <button id="cam" title="Turn off camera">Cam</button>
  <button id="popout2">Pop out</button>
  <button id="leave">Leave</button>
</div>

<div id="grid"></div>

<div id="setup">
  <p id="status"></p>
  <button id="join">Join video</button>
  <button id="popout">Open in separate window</button>
  <p id="note"></p>
  <input id="fallback" readonly>

  <hr>

  <label for="mode">Video mode</label>
  <select id="mode">
    <option value="p2p">Built in, peer to peer</option>
    <option value="jitsi">Jitsi (hosted)</option>
  </select>

  <div id="hostRow">
    <label for="server">Jitsi server</label>
    <input id="server" spellcheck="false" autocapitalize="off">
  </div>

  <div id="gmRow">
    <hr>
    <label for="shared">Shared call link (GM only)</label>
    <p>Overrides the mode above. Paste a link to any call and everyone in this
       room joins that exact call.</p>
    <input id="shared" spellcheck="false" autocapitalize="off" placeholder="https://...">
    <p id="sharedErr" class="err"></p>
    <div class="row">
      <button id="saveShared">Set for room</button>
      <button id="clearShared">Clear</button>
    </div>
  </div>
</div>

<iframe id="call" allow="camera; microphone; autoplay; display-capture; fullscreen"></iframe>

<script>
  window.__tableVideoFail = function (what, detail) {
    var b = document.getElementById("boot");
    if (!b || window.__tableVideoReady) return;
    b.style.display = "block";
    b.innerHTML = "<b>Table Video could not start.</b><br>" + what;
    if (detail) { var c = document.createElement("code"); c.textContent = detail; b.appendChild(c); }
  };
  window.addEventListener("error", function (e) {
    window.__tableVideoFail("A script error occurred.", e.message + " @ " + e.filename);
  });
  window.addEventListener("unhandledrejection", function (e) {
    window.__tableVideoFail("A background task failed.", String(e.reason));
  });
  setTimeout(function () {
    window.__tableVideoFail(
      "No response from Owlbear after 10 seconds. Close this panel and reopen it. " +
      "If it keeps happening, disable and re-enable the extension in the room menu.",
      "obrref param present: " + (new URLSearchParams(location.search).has("obrref"))
    );
  }, 10000);
</script>

<script type="module">
// Vendored rather than fetched from a CDN: every extra cross-origin request on
// startup is another thing that can hang or be cut off mid-load.
import OBR from "./obr-sdk.js";
import { callUrl, sanitizeLink, PROVIDERS } from "./callurl.js";
import { Mesh, SIGNAL_CHANNEL } from "./p2p.js";

const META_LINK = "com.github.georgedakoul.obr-table-video/callLink";
const META_IN_CALL = "com.github.georgedakoul.obr-table-video/inCall";

const remember = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const recall = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const $ = (id) => document.getElementById(id);

try {
  OBR.onReady(async () => {
    try {
      window.__tableVideoReady = true;
      $("boot").style.display = "none";
      $("setup").style.display = "flex";

      const myName = await OBR.player.getName();
      const myId = await OBR.player.getConnectionId();
      const isGM = (await OBR.player.getRole()) === "GM";
      const callRoom = "obr-table-" + OBR.room.id;

      $("mode").value = recall("tableVideoMode") || "p2p";
      $("server").value = recall("tableVideoJitsiHost") || PROVIDERS.jitsi.host;
      $("gmRow").style.display = isGM ? "block" : "none";

      let sharedLink = null;
      let joinedUrl = null;   // hosted mode
      let mesh = null;        // p2p mode
      let names = new Map();  // connectionId -> display name
      let lastError = null;   // sticky, so a failed join stays readable

      // ---------- hosted (iframe) mode ----------
      function hostedUrl() {
        if (sharedLink) return sharedLink;
        if ($("mode").value !== "jitsi") return null;
        const host = $("server").value;
        const url = callUrl("jitsi", host, callRoom, myName);
        if (url) remember("tableVideoJitsiHost", host.trim());
        return url;
      }

      const usingP2P = () => !sharedLink && $("mode").value === "p2p";

      function render() {
        remember("tableVideoMode", $("mode").value);
        $("hostRow").style.display = (!sharedLink && $("mode").value === "jitsi") ? "block" : "none";

        // A failed join has to survive the render() that runs right after it,
        // otherwise the reason is wiped and the button just looks dead.
        $("status").className = lastError ? "err" : "";
        $("status").textContent = lastError ? lastError : sharedLink
          ? "Joining the GM's call at " + new URL(sharedLink).host + "."
          : usingP2P()
            ? "Direct connection between players, no server. Best up to about 6 people."
            : "Everyone in this Owlbear room joins the same Jitsi call.";
        $("join").disabled = !sharedLink && !usingP2P() && !hostedUrl();
        $("popout").style.display = usingP2P() ? "none" : "block";
        $("popout2").style.display = usingP2P() ? "none" : "inline-block";
        $("mic").style.display = usingP2P() ? "inline-block" : "none";
        $("cam").style.display = usingP2P() ? "inline-block" : "none";
      }

      const readMeta = (meta) => {
        sharedLink = sanitizeLink(meta && meta[META_LINK]);
        if (isGM) $("shared").value = sharedLink || "";
        render();
      };
      readMeta(await OBR.room.getMetadata());
      OBR.room.onMetadataChange(readMeta);

      $("mode").onchange = () => { lastError = null; render(); };
      $("server").oninput = render;

      $("saveShared").onclick = async () => {
        const clean = sanitizeLink($("shared").value);
        if (!clean) { $("sharedErr").textContent = "Needs a full https:// link."; return; }
        $("sharedErr").textContent = "";
        await OBR.room.setMetadata({ [META_LINK]: clean });
      };
      $("clearShared").onclick = async () => {
        $("sharedErr").textContent = "";
        await OBR.room.setMetadata({ [META_LINK]: undefined });
      };

      // ---------- view switching ----------
      function showView(view, url) {
        const hosted = view === "hosted";
        $("setup").style.display = view === "setup" ? "flex" : "none";
        $("bar").style.display = view === "setup" ? "none" : "flex";
        $("call").style.display = hosted ? "block" : "none";
        $("grid").style.display = view === "p2p" ? "grid" : "none";
        const target = hosted ? url : "about:blank";
        if ($("call").src !== target) $("call").src = target;
        joinedUrl = hosted ? url : null;
        if (hosted) $("barLabel").textContent = new URL(url).host;
      }

      // ---------- peer to peer ----------
      function tile(id, label) {
        let el = document.getElementById("tile-" + id);
        if (!el) {
          el = document.createElement("div");
          el.className = "tile waiting";
          el.id = "tile-" + id;
          el.innerHTML = '<video autoplay playsinline></video><b></b>';
          $("grid").appendChild(el);
        }
        el.querySelector("b").textContent = label;
        return el;
      }

      const sendSignal = (toId, msg) =>
        OBR.broadcast.sendMessage(SIGNAL_CHANNEL, { to: toId, msg }, { destination: "REMOTE" });

      let unsubSignal = null;
      let unsubParty = null;

      async function joinP2P() {
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        } catch (err) {
          // NotReadableError almost always means another program or another
          // browser already holds the camera, which is easy to hit when testing
          // with two browsers on one machine.
          const hint = {
            NotReadableError: "Another browser or app is already using the camera. Close it, or test with a second device.",
            NotAllowedError: "Permission was refused. Allow camera and microphone for owlbear.rodeo in the site settings.",
            NotFoundError: "No camera or microphone was found on this machine.",
          }[err.name] || "Check the browser's site permissions for owlbear.rodeo.";
          lastError = "Could not start your camera (" + err.name + "). " + hint;
          return;
        }

        mesh = new Mesh({
          selfId: myId,
          send: sendSignal,
          onTrack: (peerId, remoteStream) => {
            const el = tile(peerId, names.get(peerId) || "Player");
            el.classList.remove("waiting");
            const v = el.querySelector("video");
            if (v.srcObject !== remoteStream) v.srcObject = remoteStream;
          },
          onPeerEnd: (peerId) => document.getElementById("tile-" + peerId)?.remove(),
          localStream: stream,
        });

        // Own preview. Muted so you do not hear yourself.
        const mine = tile(myId, myName + " (you)");
        mine.classList.remove("waiting");
        const mv = mine.querySelector("video");
        mv.srcObject = stream;
        mv.muted = true;

        $("barLabel").textContent = "Peer to peer";
        showView("p2p");

        unsubSignal = OBR.broadcast.onMessage(SIGNAL_CHANNEL, (event) => {
          const d = event.data;
          if (!d || d.to !== myId) return;
          // The sender identity comes from Owlbear, not from the payload.
          mesh.handleSignal(event.connectionId, d.msg);
        });

        const syncParty = (players) => {
          names = new Map(players.map((p) => [p.connectionId, p.name]));
          const inCall = players
            .filter((p) => p.metadata && p.metadata[META_IN_CALL])
            .map((p) => p.connectionId);
          for (const id of inCall) {
            if (id !== myId) tile(id, names.get(id) || "Player");
          }
          if (mesh) mesh.syncPeers(inCall);
        };
        unsubParty = OBR.party.onChange(syncParty);
        syncParty(await OBR.party.getPlayers());

        // Announce last, so peers only dial once we are ready to answer.
        await OBR.player.setMetadata({ [META_IN_CALL]: true });
      }

      async function leaveP2P() {
        if (unsubSignal) { unsubSignal(); unsubSignal = null; }
        if (unsubParty) { unsubParty(); unsubParty = null; }
        if (mesh) { mesh.close(); mesh = null; }
        $("grid").innerHTML = "";
        // Never let a failed metadata write throw out of leave: the camera is
        // already released and the UI must still return to the setup view.
        await OBR.player.setMetadata({ [META_IN_CALL]: undefined }).catch(() => {});
      }

      // Toggling track.enabled needs no renegotiation, unlike removing a track.
      const wireToggle = (id, pick, onLabel, offLabel) => {
        $(id).onclick = () => {
          const t = mesh && mesh.localStream && pick(mesh.localStream)[0];
          if (!t) return;
          t.enabled = !t.enabled;
          $(id).classList.toggle("off", !t.enabled);
          $(id).textContent = t.enabled ? onLabel : offLabel;
        };
      };
      wireToggle("mic", (s) => s.getAudioTracks(), "Mic", "Muted");
      wireToggle("cam", (s) => s.getVideoTracks(), "Cam", "Cam off");

      // ---------- join / leave ----------
      // getUserMedia takes long enough for a second click to land, which would
      // build a second mesh and leak the first one's connections and listeners.
      let joining = false;
      $("join").onclick = async () => {
        if (joining || mesh) return;
        joining = true;
        lastError = null;
        $("join").disabled = true;
        try {
          if (usingP2P()) {
            await joinP2P();
          } else {
            const url = hostedUrl();
            if (url && joinedUrl !== url) showView("hosted", url);
          }
        } finally {
          joining = false;
          render();
        }
      };

      $("leave").onclick = async () => {
        if (mesh) await leaveP2P();
        showView("setup");
        render();
      };

      // Owlbear tears the panel down without warning; release the camera and
      // clear the in-call flag so peers stop trying to reach a dead client.
      window.addEventListener("pagehide", () => {
        if (mesh) { mesh.close(); mesh = null; }
        OBR.player.setMetadata({ [META_IN_CALL]: undefined }).catch(() => {});
      });

      const popout = () => {
        const url = hostedUrl();
        if (!url) return;
        if (window.open(url, "_blank", "width=960,height=680")) {
          if (joinedUrl !== null) showView("setup");
        } else {
          $("note").textContent = "Popup blocked. Copy this link into a new tab:";
          $("fallback").value = url;
          $("fallback").style.display = "block";
          $("fallback").select();
        }
      };
      $("popout").onclick = popout;
      $("popout2").onclick = popout;

      render();
    } catch (err) {
      window.__tableVideoReady = false;
      window.__tableVideoFail("Startup failed after connecting.", String(err && err.stack || err));
    }
  });
} catch (err) {
  window.__tableVideoFail("Could not reach the Owlbear SDK.", String(err && err.stack || err));
}
</script>

</body>
</html>
