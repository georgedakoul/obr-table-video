<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Video</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #eee;
               font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }

  /* Always present once joined, so a dead call can never leave a blank panel. */
  #bar { display: none; flex: 0 0 auto; gap: 6px; padding: 6px;
         background: #262626; border-bottom: 1px solid #3a3a3a; align-items: center; }
  #bar span { flex: 1; font-size: 12px; opacity: .6; overflow: hidden;
              white-space: nowrap; text-overflow: ellipsis; }
  #bar button { padding: 4px 8px; font-size: 12px; }

  #call { flex: 1 1 auto; width: 100%; border: 0; display: none; }

  #setup { flex: 1 1 auto; padding: 16px; display: none; flex-direction: column; gap: 10px;
           overflow-y: auto; }
  label { font-size: 12px; opacity: .65; }
  input, button, select { padding: 8px 10px; font: inherit; border-radius: 6px;
                          border: 1px solid #4a4a4a; background: #2c2c2c; color: #eee; }
  input { width: 100%; box-sizing: border-box; }
  button { cursor: pointer; }
  button:hover { background: #383838; }
  #join { background: #bb99ff; color: #1e1e1e; border-color: #bb99ff; font-weight: 600; }
  #join:hover { background: #cdb3ff; }
  p { margin: 0; font-size: 12px; opacity: .6; }
  #hostRow, #fallback { display: none; }

  #boot { flex: 1 1 auto; padding: 16px; font-size: 13px; }
  #boot code { display: block; margin-top: 8px; padding: 8px; background: #000;
               border-radius: 6px; font-size: 11px; white-space: pre-wrap;
               word-break: break-all; color: #ff9b9b; }
  details { margin-top: 4px; font-size: 12px; opacity: .7; }
  summary { cursor: pointer; }
</style>
</head>
<body>

<!-- Shown until the SDK connects. Replaced by an error if it never does, so a
     failure is never a silent blank panel. -->
<div id="boot">Connecting to Owlbear&hellip;</div>

<div id="bar">
  <span id="barLabel"></span>
  <button id="popout2">Pop out</button>
  <button id="leave">Leave</button>
</div>

<div id="setup">
  <label for="provider">Video service</label>
  <select id="provider"></select>

  <div id="hostRow">
    <label for="server">Jitsi server</label>
    <input id="server" spellcheck="false" autocapitalize="off">
  </div>

  <button id="join">Join video</button>
  <button id="popout">Open in separate window</button>
  <p id="note"></p>
  <input id="fallback" readonly>

  <details>
    <summary>Call link (share if a player cannot join)</summary>
    <p id="roomLabel" style="margin-top:6px"></p>
    <input id="shareLink" readonly>
  </details>
</div>

<iframe id="call" allow="camera; microphone; autoplay; display-capture; fullscreen"></iframe>

<!-- Classic script: runs even if the module below fails to load at all (CDN
     down, blocked, syntax error), which a module-scoped handler cannot catch. -->
<script>
  window.__tableVideoFail = function (what, detail) {
    var b = document.getElementById("boot");
    if (!b || window.__tableVideoReady) return;
    b.innerHTML = "<b>Table Video could not start.</b><br>" + what;
    if (detail) { var c = document.createElement("code"); c.textContent = detail; b.appendChild(c); }
  };
  window.addEventListener("error", function (e) {
    window.__tableVideoFail("A script error occurred.", e.message + " @ " + e.filename);
  });
  window.addEventListener("unhandledrejection", function (e) {
    window.__tableVideoFail("A background task failed.", String(e.reason));
  });
  setTimeout(function () {
    window.__tableVideoFail(
      "No response from Owlbear after 10 seconds. Close this panel and reopen it. " +
      "If it keeps happening, disable and re-enable the extension in the room menu.",
      "obrref param present: " + (new URLSearchParams(location.search).has("obrref"))
    );
  }, 10000);
</script>

<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
import { callUrl, PROVIDERS } from "./callurl.js";

// ponytail: localStorage throws in cross-site iframes on Safari, so it is
// optional convenience only, never load-bearing.
const remember = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const recall = (k) => { try { return localStorage.getItem(k); } catch { return null; } };

const $ = (id) => document.getElementById(id);

try {
  OBR.onReady(async () => {
    try {
      window.__tableVideoReady = true;
      $("boot").style.display = "none";
      $("setup").style.display = "flex";

      const name = await OBR.player.getName();
      // OBR gives every client in the room the same room id (it arrives in the
      // obrref query param), so this resolves to one shared call for everyone.
      const callRoom = "obr-table-" + OBR.room.id;

      for (const [key, p] of Object.entries(PROVIDERS)) {
        $("provider").add(new Option(p.label, key));
      }
      $("provider").value = recall("tableVideoProvider") || "element";
      $("server").value = recall("tableVideoJitsiHost") || PROVIDERS.jitsi.host;
      $("note").textContent = "Everyone in this Owlbear room joins the same call.";
      $("roomLabel").textContent = "Room: " + callRoom;

      function syncHostRow() {
        const p = PROVIDERS[$("provider").value];
        $("hostRow").style.display = p && p.editableHost ? "block" : "none";
        const u = currentUrl();
        if (u) $("shareLink").value = u;
      }

      function currentUrl() {
        const key = $("provider").value;
        const p = PROVIDERS[key];
        const host = p.editableHost ? $("server").value : p.host;
        const url = callUrl(key, host, callRoom, name);
        if (url) {
          remember("tableVideoProvider", key);
          if (p.editableHost) remember("tableVideoJitsiHost", host.trim());
        }
        return url;
      }

      $("provider").onchange = syncHostRow;
      $("server").oninput = syncHostRow;
      syncHostRow();

      let joinedUrl = null;

      function show(joined, url) {
        $("setup").style.display = joined ? "none" : "flex";
        $("call").style.display = joined ? "block" : "none";
        $("bar").style.display = joined ? "flex" : "none";
        // Only touch src when the target actually changes. Reassigning the same
        // url reloads the iframe, which drops the old connection and opens a new
        // one -- the room briefly shows two of you.
        if ($("call").src !== (joined ? url : "about:blank")) {
          $("call").src = joined ? url : "about:blank";
        }
        joinedUrl = joined ? url : null;
        if (joined) $("barLabel").textContent = new URL(url).host;
      }

      $("join").onclick = () => {
        const url = currentUrl();
        if (!url) return;
        if (joinedUrl === url) return; // already in this call, don't dial twice
        show(true, url);
      };

      // The call ending (or the service booting us) leaves a dead iframe. Leave
      // puts the controls back instead of stranding the user on a blank panel.
      $("leave").onclick = () => show(false);

      const popout = () => {
        const url = currentUrl();
        if (!url) return;
        if (window.open(url, "_blank", "width=960,height=680")) {
          // Hand the call over to the new window rather than running both,
          // which would put two of you in the room. Only after the window
          // actually opened, so a blocked popup never costs you the call.
          if (joinedUrl !== null) show(false);
        } else {
          // Popup blocked by the iframe sandbox: hand over the link instead.
          $("note").textContent = "Popup blocked. Copy this link into a new tab:";
          $("fallback").value = url;
          $("fallback").style.display = "block";
          $("fallback").select();
        }
      };
      $("popout").onclick = popout;
      $("popout2").onclick = popout;
    } catch (err) {
      window.__tableVideoReady = false;
      window.__tableVideoFail("Startup failed after connecting.", String(err && err.stack || err));
    }
  });
} catch (err) {
  window.__tableVideoFail("Could not reach the Owlbear SDK.", String(err && err.stack || err));
}
</script>

</body>
</html>
