<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Video</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #eee;
               font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }

  #bar { display: flex; flex: 0 0 auto; gap: 6px; padding: 6px;
         background: #262626; border-bottom: 1px solid #3a3a3a; align-items: center; }

  /* In a call the controls float over the video and stay out of the way until
     pointed at. Touch has no hover, so tapping the video sets .touched. */
  body.in-call #bar { position: absolute; top: 0; left: 0; right: 0; z-index: 5;
         border-bottom: 0; background: linear-gradient(#000000b0, #00000000);
         opacity: 0; pointer-events: none; transition: opacity .15s ease; }
  body.in-call:hover #bar,
  body.in-call.touched #bar,
  body.in-call #bar:focus-within { opacity: 1; pointer-events: auto; }
  body.in-call #bar button { background: #2c2c2ccc; border-color: #ffffff33;
         backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  body.in-call #bar button:hover { background: #3d3d3de6; }
  /* Must out-specify "body.in-call #bar button" above, which otherwise wins
     over "#bar button.off" and swallowed the muted colour during a call. */
  body.in-call #bar button.off,
  #bar button.off { background: #8c2f2fe6; border-color: #ff8a8a66; color: #fff; }
  body.in-call #bar button.off:hover,
  #bar button.off:hover { background: #a53a3af2; }
  body.in-call #barLabel { text-shadow: 0 1px 2px #000; }
  #bar span { flex: 1; font-size: 12px; opacity: .6; overflow: hidden;
              white-space: nowrap; text-overflow: ellipsis; }
  #bar button { padding: 4px 8px; font-size: 12px; }
  #mic, #cam, #leave, #popout2, #swapCut { display: none; }
  body.is-gm.in-call.mode-p2p #swapCut { display: inline-block; }
  body.in-call #leave { display: inline-block; }
  body.in-call.mode-p2p #mic, body.in-call.mode-p2p #cam { display: inline-block; }
  body.in-call:not(.mode-p2p) #popout2 { display: inline-block; }

  #call { flex: 1 1 auto; width: 100%; border: 0; display: none; }

  /* Peer-to-peer video grid */
  #grid { display: none; flex: 1 1 auto; overflow-y: auto; padding: 6px;
          gap: 6px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
          align-content: start; }
  .tile { position: relative; background: #000; border-radius: 8px; overflow: hidden;
          aspect-ratio: 4 / 3; min-width: 0; width: 100%; justify-self: center;
          /* 4:3 at full width can be taller than the panel, which pushed the
             video out of the frame. Capping the width caps the height with it
             and keeps the ratio intact. */
          max-width: calc((100vh - 24px) * 4 / 3); }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile b { position: absolute; left: 0; bottom: 0; right: 0; padding: 2px 6px;
            font: 500 11px system-ui; background: linear-gradient(transparent, #000c);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.waiting::after { content: attr(data-state); position: absolute; inset: 0;
            display: grid; place-items: center; font-size: 11px; opacity: .6; }
  /* GM-only per-player cutoff, revealed on hover or tap like the main bar. */
  .tile .cut { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
               width: 44px; height: 44px; padding: 0; border-radius: 50%;
               display: grid; place-items: center; font-size: 19px; line-height: 1;
               border: 1px solid #ffffff40; background: #000000a6; color: #fff;
               cursor: pointer; opacity: 0; transition: opacity .15s ease;
               backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .tile .cut:hover { background: #000000d9; }
  .tile:hover .cut, body.touched .tile .cut { opacity: 1; }
  .tile.silenced .cut { opacity: 1; background: #8c2f2fe6; }
  .tile.silenced { outline: 2px solid #8c2f2f; outline-offset: -2px; }
  #cutBanner { display: none; flex: 0 0 auto; padding: 6px 8px; background: #8c2f2f;
               color: #fff; font-size: 12px; text-align: center; }
  body.silenced-me #cutBanner { display: block; }

  #setup { flex: 1 1 auto; padding: 16px; display: none; flex-direction: column; gap: 10px;
           overflow-y: auto; }
  label { font-size: 12px; opacity: .65; }
  input, button, select { padding: 8px 10px; font: inherit; border-radius: 6px;
                          border: 1px solid #4a4a4a; background: #2c2c2c; color: #eee; }
  input { width: 100%; box-sizing: border-box; }
  button { cursor: pointer; }
  button:hover { background: #383838; }
  #join { background: #bb99ff; color: #1e1e1e; border-color: #bb99ff; font-weight: 600; }
  #join:hover { background: #cdb3ff; }
  #join:disabled { background: #444; color: #999; border-color: #444; cursor: default; }
  p { margin: 0; font-size: 12px; opacity: .6; }
  .err { color: #ff9b9b; }
  #hostRow, #fallback, #gmRow { display: none; }
  hr { border: 0; border-top: 1px solid #3a3a3a; margin: 4px 0; }
  .row { display: flex; gap: 6px; }
  .row button { flex: 0 0 auto; }

  /* Resize grip, only present while the panel is unlocked. */
  #grip { display: none; position: fixed; right: 0; bottom: 0; width: 18px; height: 18px;
          cursor: nwse-resize; z-index: 10; touch-action: none;
          color: #8a8a8a; font-size: 13px; line-height: 18px; text-align: right; }
  #grip::after { content: "\25E2"; }
  body.unlocked #grip { display: block; }

  #boot { flex: 1 1 auto; padding: 16px; font-size: 13px; }
  #boot code { display: block; margin-top: 8px; padding: 8px; background: #000;
               border-radius: 6px; font-size: 11px; white-space: pre-wrap;
               word-break: break-all; color: #ff9b9b; }
</style>
</head>
<body>

<div id="boot">Connecting to Owlbear&hellip;</div>

<div id="bar">
  <button id="lock" title="Unlock to resize the panel">🔓</button>
  <span id="barLabel"></span>
  <button id="swapCut" title="Swap who can hear: everyone cut off is let back in, everyone else is cut off">⇄</button>
  <button id="mic" title="Mute microphone">Mic</button>
  <button id="cam" title="Turn off camera">Cam</button>
  <button id="popout2">Pop out</button>
  <button id="leave">Leave</button>
</div>

<div id="cutBanner">The GM has cut your audio. You cannot hear the table.</div>

<div id="grid"></div>

<div id="setup">
  <p id="status"></p>
  <button id="join">Join video</button>
  <button id="popout">Open in separate window</button>
  <p id="note"></p>
  <input id="fallback" readonly>

  <hr>

  <p id="build"></p>

  <label for="mode">Video mode</label>
  <select id="mode">
    <option value="p2p">Built in, peer to peer</option>
    <option value="jitsi">Jitsi (hosted)</option>
  </select>

  <div id="hostRow">
    <label for="server">Jitsi server</label>
    <input id="server" spellcheck="false" autocapitalize="off">
  </div>

  <div id="gmRow">
    <hr>
    <label for="shared">Shared call link (GM only)</label>
    <p>Overrides the mode above. Paste a link to any call and everyone in this
       room joins that exact call.</p>
    <input id="shared" spellcheck="false" autocapitalize="off" placeholder="https://...">
    <p id="sharedErr" class="err"></p>
    <div class="row">
      <button id="saveShared">Set for room</button>
      <button id="clearShared">Clear</button>
    </div>
  </div>
</div>

<div id="grip" title="Drag to resize"></div>

<iframe id="call" allow="camera; microphone; autoplay; display-capture; fullscreen"></iframe>

<script>
  window.__tableVideoFail = function (what, detail) {
    var b = document.getElementById("boot");
    if (!b || window.__tableVideoReady) return;
    b.style.display = "block";
    b.innerHTML = "<b>Table Video could not start.</b><br>" + what;
    if (detail) { var c = document.createElement("code"); c.textContent = detail; b.appendChild(c); }
  };
  window.addEventListener("error", function (e) {
    window.__tableVideoFail("A script error occurred.", e.message + " @ " + e.filename);
  });
  window.addEventListener("unhandledrejection", function (e) {
    window.__tableVideoFail("A background task failed.", String(e.reason));
  });
  setTimeout(function () {
    window.__tableVideoFail(
      "No response from Owlbear after 10 seconds. Close this panel and reopen it. " +
      "If it keeps happening, disable and re-enable the extension in the room menu.",
      "obrref param present: " + (new URLSearchParams(location.search).has("obrref"))
    );
  }, 10000);
</script>

<script type="module">
// Vendored rather than fetched from a CDN: every extra cross-origin request on
// startup is another thing that can hang or be cut off mid-load.
import OBR from "./obr-sdk.js?v=24";
import { callUrl, sanitizeLink, PROVIDERS } from "./callurl.js?v=24";
import { Mesh, SIGNAL_CHANNEL } from "./p2p.js?v=24";

const BUILD = "24";  // bump together with the ?v= on the imports above
const META_LINK = "com.github.georgedakoul.obr-table-video/callLink";
const META_IN_CALL = "com.github.georgedakoul.obr-table-video/inCall";
// Connection ids the GM has cut off from hearing the table. Every client reads
// this and stops sending that peer audio, so it does not rely on the excluded
// client muting itself.
const META_SILENCED = "com.github.georgedakoul.obr-table-video/silenced";

const remember = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const recall = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const $ = (id) => document.getElementById(id);

try {
  OBR.onReady(async () => {
    try {
      window.__tableVideoReady = true;
      $("boot").style.display = "none";
      $("setup").style.display = "flex";

      const myName = await OBR.player.getName();
      const myId = await OBR.player.getConnectionId();
      const isGM = (await OBR.player.getRole()) === "GM";
      const callRoom = "obr-table-" + OBR.room.id;

      $("mode").value = recall("tableVideoMode") || "p2p";
      $("server").value = recall("tableVideoJitsiHost") || PROVIDERS.jitsi.host;
      $("gmRow").style.display = isGM ? "block" : "none";
      document.body.classList.toggle("is-gm", isGM);

      let sharedLink = null;
      let joinedUrl = null;   // hosted mode
      let mesh = null;        // p2p mode
      let names = new Map();  // connectionId -> display name
      let lastError = null;   // sticky, so a failed join stays readable
      let signalErr = "";     // most recent signalling failure
      let silenced = new Set(); // connection ids the GM has cut off

      // ---------- hosted (iframe) mode ----------
      function hostedUrl() {
        if (sharedLink) return sharedLink;
        if ($("mode").value !== "jitsi") return null;
        const host = $("server").value;
        const url = callUrl("jitsi", host, callRoom, myName);
        if (url) remember("tableVideoJitsiHost", host.trim());
        return url;
      }

      const usingP2P = () => !sharedLink && $("mode").value === "p2p";

      function render() {
        remember("tableVideoMode", $("mode").value);
        $("hostRow").style.display = (!sharedLink && $("mode").value === "jitsi") ? "block" : "none";

        // A failed join has to survive the render() that runs right after it,
        // otherwise the reason is wiped and the button just looks dead.
        $("status").className = lastError ? "err" : "";
        $("status").textContent = lastError ? lastError : sharedLink
          ? "Joining the GM's call at " + new URL(sharedLink).host + "."
          : usingP2P()
            ? "Direct connection between players, no server. Best up to about 6 people."
            : "Everyone in this Owlbear room joins the same Jitsi call.";
        $("join").disabled = !sharedLink && !usingP2P() && !hostedUrl();
        $("build").textContent = "build " + BUILD;
        $("popout").style.display = usingP2P() ? "none" : "block";
        document.body.classList.toggle("mode-p2p", usingP2P());
      }

      const readMeta = (meta) => {
        sharedLink = sanitizeLink(meta && meta[META_LINK]);
        const raw = meta && meta[META_SILENCED];
        silenced = new Set(Array.isArray(raw) ? raw.filter((v) => typeof v === "string") : []);
        if (isGM) $("shared").value = sharedLink || "";
        applySilenced();
        render();
      };
      readMeta(await OBR.room.getMetadata());
      OBR.room.onMetadataChange(readMeta);

      $("mode").onchange = () => { lastError = null; render(); };
      $("server").oninput = render;

      $("saveShared").onclick = async () => {
        const clean = sanitizeLink($("shared").value);
        if (!clean) { $("sharedErr").textContent = "Needs a full https:// link."; return; }
        $("sharedErr").textContent = "";
        await OBR.room.setMetadata({ [META_LINK]: clean });
      };
      $("clearShared").onclick = async () => {
        $("sharedErr").textContent = "";
        await OBR.room.setMetadata({ [META_LINK]: undefined });
      };

      // ---------- view switching ----------
      function showView(view, url) {
        const hosted = view === "hosted";
        // The bar is always present so the lock stays reachable; CSS decides
        // which controls belong to which view, so nothing can overlap.
        document.body.classList.toggle("in-call", view !== "setup");
        $("setup").style.display = view === "setup" ? "flex" : "none";
        $("call").style.display = hosted ? "block" : "none";
        $("grid").style.display = view === "p2p" ? "grid" : "none";
        const target = hosted ? url : "about:blank";
        if ($("call").src !== target) $("call").src = target;
        joinedUrl = hosted ? url : null;
        if (hosted) $("barLabel").textContent = new URL(url).host;
      }

      // ---------- peer to peer ----------
      function tile(id, label) {
        let el = document.getElementById("tile-" + id);
        if (!el) {
          el = document.createElement("div");
          el.className = "tile waiting";
          el.id = "tile-" + id;
          el.dataset.state = "waiting";
          el.innerHTML = '<video autoplay playsinline></video><b></b>';
          // Only the GM gets the cutoff control, and never on their own tile.
          if (isGM && id !== myId) {
            const cut = document.createElement("button");
            cut.className = "cut";
            cut.onclick = () => toggleSilenced(id);
            el.appendChild(cut);
          }
          $("grid").appendChild(el);
        }
        el.querySelector("b").textContent = label;
        paintSilence(el, id);
        return el;
      }

      function paintSilence(el, id) {
        const off = silenced.has(id);
        el.classList.toggle("silenced", off);
        const cut = el.querySelector(".cut");
        if (cut) {
          cut.textContent = off ? "🔇" : "🔊";
          cut.title = off
            ? "This player cannot hear anyone. Click to let them hear again."
            : "Stop this player hearing the table, you included";
        }
      }

      // Flip the cutoff: whoever could hear is cut off and whoever was cut off
      // is let back in. Lets the GM bounce between two groups in one click.
      async function invertSilenced() {
        if (!mesh) return;
        const next = [...mesh.peers.keys()].filter((id) => !silenced.has(id));
        await OBR.room.setMetadata({ [META_SILENCED]: next }).catch(() => {});
      }

      async function toggleSilenced(id) {
        const next = new Set(silenced);
        if (next.has(id)) next.delete(id); else next.add(id);
        await OBR.room.setMetadata({ [META_SILENCED]: [...next] }).catch(() => {});
      }

      // Applies whatever the GM has set, on every client. That is what makes it
      // stick: every peer, the GM included, stops sending audio to the excluded
      // player, so they hear nobody at all.
      function applySilenced() {
        if (mesh) mesh.setSilenced(silenced);
        document.body.classList.toggle("silenced-me", silenced.has(myId));
        for (const el of $("grid").querySelectorAll(".tile")) {
          paintSilence(el, el.id.slice("tile-".length));
        }
      }

      // Peers only need to know if something went wrong; the detailed counters
      // were debugging scaffolding and are gone.
      function updateBar() {
        if (!mesh) return;
        const others = mesh.peers.size;
        $("barLabel").textContent = signalErr
          ? signalErr
          : others ? `${others} connected` : "waiting for others";
      }

      const sendSignal = (toId, msg) =>
        OBR.broadcast.sendMessage(SIGNAL_CHANNEL, { to: toId, msg }, { destination: "REMOTE" });

      let unsubSignal = null;
      let unsubParty = null;

      async function joinP2P() {
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        } catch (err) {
          // NotReadableError almost always means another program or another
          // browser already holds the camera, which is easy to hit when testing
          // with two browsers on one machine.
          const hint = {
            NotReadableError: "Another browser or app is already using the camera. Close it, or test with a second device.",
            NotAllowedError: "Permission was refused. Allow camera and microphone for owlbear.rodeo in the site settings.",
            NotFoundError: "No camera or microphone was found on this machine.",
          }[err.name] || "Check the browser's site permissions for owlbear.rodeo.";
          lastError = "Could not start your camera (" + err.name + "). " + hint;
          return;
        }

        applyTogglePrefs(stream);

        mesh = new Mesh({
          selfId: myId,
          send: sendSignal,
          onTrack: (peerId, remoteStream) => {
            const el = tile(peerId, names.get(peerId) || "Player");
            el.classList.remove("waiting");
            const v = el.querySelector("video");
            if (v.srcObject !== remoteStream) v.srcObject = remoteStream;
          },
          onPeerEnd: (peerId) => document.getElementById("tile-" + peerId)?.remove(),
          onError: (peerId, err) => { signalErr = err; updateBar(); },
          onState: (peerId, state) => {
            const el = document.getElementById("tile-" + peerId);
            if (el) el.dataset.state = state;
            updateBar();
          },
          localStream: stream,
        });

        // Own preview. Muted so you do not hear yourself.
        const mine = tile(myId, myName + " (you)");
        mine.classList.remove("waiting");
        const mv = mine.querySelector("video");
        mv.srcObject = stream;
        mv.muted = true;

        updateBar();
        refreshToggles();
        applySilenced();   // a fresh mesh must adopt whatever the GM already set
        showView("p2p");

        unsubSignal = OBR.broadcast.onMessage(SIGNAL_CHANNEL, (event) => {
          const d = event.data;
          if (!d) return;
          if (d.to !== myId) return;
          // The sender identity comes from Owlbear, not from the payload.
          mesh.handleSignal(event.connectionId, d.msg);
        });

        const syncParty = (players) => {
          names = new Map(players.map((p) => [p.connectionId, p.name]));
          const inCall = players
            .filter((p) => p.metadata && p.metadata[META_IN_CALL])
            .map((p) => p.connectionId);
          for (const id of inCall) {
            if (id !== myId) tile(id, names.get(id) || "Player");
          }
          if (mesh) { mesh.syncPeers(inCall); updateBar(); }
        };
        unsubParty = OBR.party.onChange(syncParty);
        syncParty(await OBR.party.getPlayers());

        // Announce last, so peers only dial once we are ready to answer.
        await OBR.player.setMetadata({ [META_IN_CALL]: true });
      }

      async function leaveP2P() {
        if (unsubSignal) { unsubSignal(); unsubSignal = null; }
        if (unsubParty) { unsubParty(); unsubParty = null; }
        if (mesh) { mesh.close(); mesh = null; }
        $("grid").innerHTML = "";
        refreshToggles();
        // Never let a failed metadata write throw out of leave: the camera is
        // already released and the UI must still return to the setup view.
        await OBR.player.setMetadata({ [META_IN_CALL]: undefined }).catch(() => {});
      }

      // Mic and camera. The label is always derived from the actual track, never
      // stored separately, so the button can never claim "Muted" while the mic
      // is live. The user's choice is remembered and reapplied on the next join.
      const TOGGLES = {
        mic: { key: "tableVideoMicOn", pick: (s) => s.getAudioTracks(), label: "Mic",
               on: "Microphone on, click to mute", off: "Microphone muted, click to unmute" },
        cam: { key: "tableVideoCamOn", pick: (s) => s.getVideoTracks(), label: "Cam",
               on: "Camera on, click to turn off", off: "Camera off, click to turn on" },
      };

      const wantOn = (id) => recall(TOGGLES[id].key) !== "0";

      function refreshToggles() {
        for (const [id, t] of Object.entries(TOGGLES)) {
          const track = mesh && mesh.localStream && t.pick(mesh.localStream)[0];
          const live = track ? track.enabled : wantOn(id);
          $(id).disabled = !track;
          // The label stays put; colour carries the state. Title and
          // aria-pressed keep it available to anyone not reading the colour.
          $(id).classList.toggle("off", !live);
          $(id).textContent = t.label;
          $(id).title = live ? t.on : t.off;
          $(id).setAttribute("aria-pressed", String(!live));
        }
      }

      // Apply the remembered preference to a freshly acquired stream.
      function applyTogglePrefs(stream) {
        for (const [id, t] of Object.entries(TOGGLES)) {
          const track = t.pick(stream)[0];
          if (track) track.enabled = wantOn(id);
        }
      }

      for (const [id, t] of Object.entries(TOGGLES)) {
        $(id).onclick = () => {
          const track = mesh && mesh.localStream && t.pick(mesh.localStream)[0];
          if (!track) return;
          track.enabled = !track.enabled;
          remember(t.key, track.enabled ? "1" : "0");
          refreshToggles();
        };
      }

      // ---------- join / leave ----------
      // getUserMedia takes long enough for a second click to land, which would
      // build a second mesh and leak the first one's connections and listeners.
      let joining = false;
      $("join").onclick = async () => {
        if (joining || mesh) return;
        joining = true;
        lastError = null;
        $("join").disabled = true;
        try {
          if (usingP2P()) {
            await joinP2P();
          } else {
            const url = hostedUrl();
            if (url && joinedUrl !== url) showView("hosted", url);
          }
        } finally {
          joining = false;
          render();
        }
      };

      $("leave").onclick = async () => {
        if (mesh) await leaveP2P();
        showView("setup");
        render();
      };

      // Owlbear tears the panel down without warning; release the camera and
      // clear the in-call flag so peers stop trying to reach a dead client.
      window.addEventListener("pagehide", () => {
        if (mesh) { mesh.close(); mesh = null; }
        OBR.player.setMetadata({ [META_IN_CALL]: undefined }).catch(() => {});
      });

      const popout = () => {
        const url = hostedUrl();
        if (!url) return;
        if (window.open(url, "_blank", "width=960,height=680")) {
          if (joinedUrl !== null) showView("setup");
        } else {
          $("note").textContent = "Popup blocked. Copy this link into a new tab:";
          $("fallback").value = url;
          $("fallback").style.display = "block";
          $("fallback").select();
        }
      };
      $("swapCut").onclick = invertSilenced;
      $("popout").onclick = popout;
      $("popout2").onclick = popout;

      // ---------- panel size ----------
      // Owlbear owns the popover, so resizing means asking it to change the
      // action size. Screen coordinates are used because the iframe itself is
      // being resized under the pointer, which makes client coordinates drift.
      // No upper bound. The floor only exists so the panel can never be shrunk
      // to something with no grip left to drag back.
      const SIZE = { minW: 180, maxW: 100000, minH: 140, maxH: 100000, w: 420, h: 540 };
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(v)));

      let panelW = clamp(Number(recall("tableVideoW")) || SIZE.w, SIZE.minW, SIZE.maxW);
      let panelH = clamp(Number(recall("tableVideoH")) || SIZE.h, SIZE.minH, SIZE.maxH);
      let locked = recall("tableVideoLocked") !== "0";

      // Each setter is a round trip to Owlbear which relayouts the popover, so
      // firing both every frame is what made dragging feel like treacle. Only
      // send a dimension that actually changed, and no more than once per
      // interval, with a trailing call so the final size is never dropped.
      let appliedW = null, appliedH = null;
      let sizeTimer = null, sizeDirty = false;

      function flushSize() {
        sizeDirty = false;
        if (panelW !== appliedW) { appliedW = panelW; OBR.action.setWidth(panelW).catch(() => {}); }
        if (panelH !== appliedH) { appliedH = panelH; OBR.action.setHeight(panelH).catch(() => {}); }
      }

      const APPLY_MS = 90;
      function applySize() {
        if (sizeTimer) { sizeDirty = true; return; }
        flushSize();
        sizeTimer = setTimeout(() => {
          sizeTimer = null;
          if (sizeDirty) applySize();
        }, APPLY_MS);
      }

      function renderLock() {
        document.body.classList.toggle("unlocked", !locked);
        $("lock").textContent = locked ? "🔒" : "🔓";
        $("lock").title = locked
          ? "Panel size locked. Click to unlock and resize."
          : "Panel size unlocked. Drag the corner, or click to lock.";
      }

      $("lock").onclick = () => {
        locked = !locked;
        remember("tableVideoLocked", locked ? "1" : "0");
        renderLock();
      };

      let drag = null;
      $("grip").addEventListener("pointerdown", (e) => {
        if (locked) return;
        drag = { x: e.screenX, y: e.screenY, w: panelW, h: panelH };
        $("grip").setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      $("grip").addEventListener("pointermove", (e) => {
        // No locked check needed: locking hides #grip, which releases the
        // pointer capture and fires pointercancel.
        if (!drag) return;
        panelW = clamp(drag.w + (e.screenX - drag.x), SIZE.minW, SIZE.maxW);
        panelH = clamp(drag.h + (e.screenY - drag.y), SIZE.minH, SIZE.maxH);
        applySize();
      });
      const endDrag = () => {
        if (!drag) return;
        drag = null;
        remember("tableVideoW", panelW);
        remember("tableVideoH", panelH);
        applySize();
      };
      $("grip").addEventListener("pointerup", endDrag);
      $("grip").addEventListener("pointercancel", endDrag);

      // Touch devices have no hover, so a tap anywhere over the video reveals
      // the controls and they fade out again shortly after.
      let touchTimer = null;
      const revealControls = () => {
        document.body.classList.add("touched");
        clearTimeout(touchTimer);
        touchTimer = setTimeout(() => document.body.classList.remove("touched"), 3500);
      };
      for (const el of [$("grid"), $("bar")]) {
        el.addEventListener("pointerdown", revealControls);
      }

      renderLock();
      applySize();

      render();
    } catch (err) {
      window.__tableVideoReady = false;
      window.__tableVideoFail("Startup failed after connecting.", String(err && err.stack || err));
    }
  });
} catch (err) {
  window.__tableVideoFail("Could not reach the Owlbear SDK.", String(err && err.stack || err));
}
</script>

</body>
</html>
